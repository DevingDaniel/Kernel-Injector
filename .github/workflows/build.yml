name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download WDK installer
        shell: cmd
        run: |
          echo Downloading WDK...
          curl -L -o wdksetup.exe "https://download.microsoft.com/download/5/8/7/587B9B7F-8C4E-4F3E-9B3D-7E6F8C9D0E1F/wdksetup.exe"
          dir wdksetup.exe
      
      - name: Install WDK
        shell: cmd
        run: wdksetup.exe /quiet /norestart
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
      
      - name: Build solution
        shell: cmd
        run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/Release/*
