name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and install WDK
        shell: cmd
        run: |
          echo Downloading WDK...
          curl -L -o wdksetup.exe "https://download.microsoft.com/download/1/2/3/12345678-1234-1234-1234-123456789012/wdksetup.exe"
          echo Installing WDK...
          wdksetup.exe /quiet /norestart
          echo WDK install completed with exit code: %ERRORLEVEL%
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
      
      - name: Build solution
        shell: cmd
        run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/Release/*
