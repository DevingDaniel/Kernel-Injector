name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1

      - name: List repo contents
        run: dir
        shell: cmd

      - name: Build
        run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/Release/*
