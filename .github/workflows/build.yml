name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
      
      - name: Build injector
        shell: cmd
        run: msbuild injector\PhantomInjector.vcxproj /m /p:Configuration=Release /p:Platform=x64
      
      - name: Build client
        shell: cmd
        run: msbuild client\PhantomClient.vcxproj /m /p:Configuration=Release /p:Platform=x64
      
      - name: Upload injector binary
        uses: actions/upload-artifact@v4
        with:
          name: PhantomInjector
          path: injector/x64/Release/PhantomInjector.exe
      
      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: PhantomClient
          path: client/x64/Release/PhantomClient.dll
