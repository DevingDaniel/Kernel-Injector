name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Download WDK
        shell: cmd
        run: |
          echo Downloading WDK from Microsoft...
          curl -L -o wdksetup.exe "https://download.microsoft.com/download/5/8/7/587B9B7F-8C4E-4F3E-9B3D-7E6F8C9D0E1F/wdksetup.exe"
          echo File size:
          dir wdksetup.exe
      
      - name: Install WDK silently
        shell: cmd
        run: |
          echo Installing WDK...
          wdksetup.exe /quiet /norestart /install
          echo WDK install exit code: %ERRORLEVEL%
      
      - name: Verify WDK installation
        shell: cmd
        run: |
          dir "C:\Program Files (x86)\Windows Kits\10\Include" /b
          if exist "C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\km\ntddk.h" (
            echo WDK found: ntddk.h exists
          ) else (
            echo WDK not found: ntddk.h missing
          )
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
      
      - name: Build solution
        shell: cmd
        run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/Release/*
