name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup VS build environment
        shell: cmd
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\Common7\Tools\vsdevcmd.bat" -arch=x64 -host_logger_id=0
          dir "C:\Program Files (x86)\Windows Kits\10\Include" /b
          if exist "C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\km\ntddk.h" (
            echo WDK headers found
          ) else (
            echo WDK headers NOT found, searching...
            dir "C:\Program Files (x86)\Windows Kits\10" /s /b ntddk.h 2>nul
          )
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
      
      - name: Build solution
        shell: cmd
        run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/Release/*
