name: Build
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v1
      - run: msbuild PhantomInject.sln /m /p:Configuration=Release /p:Platform=x64
        working-directory: PhantomInject
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: PhantomInject/bin/Release/*
